<div class="academic-intro__mascot" data-duck-mesh="{{ '/assets/3d/duck-mascot-rig.mesh' | relative_url }}">
  <div class="duck-rail">
    <button type="button" class="duck-motion" aria-label="Pause duck motion" hidden></button>
  </div>
  <div class="duck-stage">
    <img class="duck-poster" src="{{ '/images/duck-mascot.webp' | relative_url }}" width="800" height="800" alt="">
    <button type="button" class="duck-turn" aria-label="Rotate the 3D duck. Arrow keys turn and tilt. Shift with an arrow key rolls." title="Drag in any direction. Drag around the rim or hold Shift to roll." hidden>
      <canvas aria-hidden="true"></canvas>
    </button>
  </div>
</div>
